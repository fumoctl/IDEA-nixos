name: update

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes

      - name: Update flake.lock and verify checks
        id: lock
        run: |
          # Try updating all inputs; if nixpkgs-unstable bumped IDEA ahead of nix-jetbrains-plugins,
          # fall back to updating nix-jetbrains-plugins alone so plugin catalog updates still land.
          if ! (nix flake update && nix flake check --print-build-logs); then
            echo "Full update failed checks; falling back to nix-jetbrains-plugins only..."
            git checkout -- flake.lock
            nix flake update nix-jetbrains-plugins
            nix flake check --print-build-logs
          fi
          nix eval --raw .#checks.aarch64-linux.module-eval.drvPath
          if git diff --quiet flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open and auto-merge PR
        if: steps.lock.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
          BRANCH: update/flake-lock
        run: |
          gh api "repos/$GH_REPO/git/refs/heads/$BRANCH" -X DELETE >/dev/null 2>&1 || true
          gh api "repos/$GH_REPO/git/refs" \
            -f ref="refs/heads/$BRANCH" -f sha="$GITHUB_SHA" >/dev/null
          gh api graphql \
            -f repo="$GH_REPO" \
            -f branch="$BRANCH" \
            -f oid="$GITHUB_SHA" \
            -f headline="update flake.lock" \
            -f contents="$(base64 -w0 flake.lock)" \
            -f query='
              mutation($repo: String!, $branch: String!, $oid: GitObjectID!, $headline: String!, $contents: Base64String!) {
                createCommitOnBranch(input: {
                  branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                  message: { headline: $headline },
                  expectedHeadOid: $oid,
                  fileChanges: { additions: [{ path: "flake.lock", contents: $contents }] }
                }) { commit { oid } }
              }' >/dev/null

          PR_URL=$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json url --jq '.[0].url // empty')
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create --base "$BASE" --head "$BRANCH" \
              --title "update flake.lock" \
              --body "Automated weekly \`flake.lock\` update verified against \`nix flake check\`.")
          fi
          gh workflow run check.yml --ref "$BRANCH" || true
          gh pr merge "$PR_URL" --auto --squash --delete-branch \
            || gh pr merge "$PR_URL" --squash --delete-branch
